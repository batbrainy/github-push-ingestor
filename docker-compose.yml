# Compose topology per IMPLEMENTATION_PLAN.md §2A.
#
# `docker compose up --build` starts db + setup + web + worker, and continuous
# polling begins immediately: the worker's Solid Queue scheduler fires
# config/recurring.yml's 60-second tick. The `tools`-profiled services run
# only when explicitly targeted:
#
#   docker compose run --rm ingest   # one ingestion cycle, then the state
#                                    # summary (plan §9)
#   docker compose run --rm test     # isolated test databases; never touches
#                                    # the development databases
#
# Docker's default restart policy is `no`, so crash recovery is declared
# explicitly: `unless-stopped` on long-running services, never on one-shots.

name: github-push-ingestor

x-app-env: &app_env
  RAILS_ENV: ${RAILS_ENV:-development}
  POSTGRES_HOST: db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
  # live | fixture (plan §6, §12). Live ingestion is the default runtime
  # behavior; fixture resolves every request inside fixtures/github/ with no
  # network at all. It lives in the shared anchor because the choice has to be
  # process-wide — a poller and an enrichment worker disagreeing about the mode
  # would be worse than either setting.
  GITHUB_MODE: ${GITHUB_MODE:-live}
  GITHUB_FIXTURE_SCENARIO: ${GITHUB_FIXTURE_SCENARIO:-default}
  # The four inputs to §10's allowance formula, forwarded so a reviewer can actually
  # change them. Without these lines `MAX_PAGES_PER_POLL=3 docker compose run --rm ingest`
  # sets the variable in the reviewer's shell and nothing at all inside the container, and
  # the pagination walk the README documents cannot be reproduced. They belong in the
  # shared anchor for the same reason GITHUB_MODE does: the formula must come out the same
  # in every process, since one ledger serves all of them.
  POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
  MAX_PAGES_PER_POLL: ${MAX_PAGES_PER_POLL:-1}
  ENABLED_LIVE_SOURCE_COUNT: ${ENABLED_LIVE_SOURCE_COUNT:-1}
  RATE_LIMIT_RESERVE: ${RATE_LIMIT_RESERVE:-8}
  # §10's enrichment policy, in the shared anchor for a sharper version of the same
  # reason. ACTOR_ENRICHMENT_SHARE decides how the ledger splits the enrichment allowance
  # under its row lock, and the three timings decide which candidates are *currently
  # eligible* — which is the input to the borrow decision the ledger then acts on. Two
  # processes reading different values would enforce different policies against one row.
  ACTOR_ENRICHMENT_SHARE: ${ACTOR_ENRICHMENT_SHARE:-0.50}
  ENRICHMENT_ELIGIBILITY_WINDOW_SECONDS: ${ENRICHMENT_ELIGIBILITY_WINDOW_SECONDS:-3600}
  ACTOR_REFRESH_TTL_SECONDS: ${ACTOR_REFRESH_TTL_SECONDS:-86400}
  REPOSITORY_REFRESH_TTL_SECONDS: ${REPOSITORY_REFRESH_TTL_SECONDS:-86400}
  # §11's coverage window, forwarded for the same reason the four allowance inputs are —
  # without this line `ENRICHMENT_COVERAGE_WINDOW_SECONDS=604800 docker compose up` sets
  # the variable in the reviewer's shell and nothing at all inside the container. It sits
  # in the shared anchor for consistency rather than for correctness: unlike every other
  # member here it changes only what /status *reports*, never what any process *does*, so
  # a disagreement between two processes would be cosmetic rather than a policy split.
  ENRICHMENT_COVERAGE_WINDOW_SECONDS: ${ENRICHMENT_COVERAGE_WINDOW_SECONDS:-86400}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP check on purpose: postgres's first-boot initdb runs a temporary
      # server that answers pg_isready on the unix socket only — a socket
      # check can report healthy before the real server is up.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: prepares BOTH the primary and queue databases declared in
  # config/database.yml, so web and worker never race concurrent db:prepare
  # runs.
  setup:
    build: .
    image: github-push-ingestor-app
    restart: "no"
    command: ["bin/rails", "db:prepare"]
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    image: github-push-ingestor-app
    restart: unless-stopped
    # Puma directly (no `bin/rails server` pid file) so `unless-stopped`
    # actually recovers from ungraceful kills — see the Dockerfile CMD note.
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    ports:
      - "3000:3000"
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The always-on background worker (plan §2A's topology table): one Solid Queue
  # supervisor running the 60-second poll tick, the enrichment jobs, and the
  # entity-scoped reconciler. Same image and the same shared environment as web,
  # because one ledger row serves every process and two policies against it
  # would be worse than either.
  #
  # stop_grace_period pairs with SolidQueue.shutdown_timeout (20s, set in
  # config/application.rb from §2A's pinned HTTP timeouts): 20s for an in-flight
  # attempt that already holds the request gate, and 10s of margin for the
  # supervisor to reap its children. A job still *waiting* for the gate has
  # reserved nothing and is safe to kill — §8's at-least-once execution with
  # idempotent writes is what makes that true, and both advisory locks die with
  # the session.
  #
  # No healthcheck. Nothing depends on this service, `unless-stopped` already
  # covers process death, and the only probe that could tell a hung worker from
  # a busy one would have to boot Rails on every interval; Solid Queue's own
  # heartbeats in solid_queue_processes are the durable evidence instead.
  worker:
    build: .
    image: github-push-ingestor-app
    restart: unless-stopped
    command: ["bin/jobs"]
    stop_grace_period: 30s
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  # One-shot ingestion (plan §2A's topology table, §9's contract). Profiled so
  # a plain `up` never starts it, and `restart: "no"` because a one-shot that
  # restarts is a poller.
  #
  # An entrypoint rather than a command, so the plan's bare invocation and a
  # flagged one both work:
  #
  #   docker compose run --rm ingest
  #   docker compose run --rm ingest --force
  #
  # `command: []` is explicit: overriding the entrypoint clears the image's
  # CMD, and saying so here means the puma command can never arrive as
  # arguments to bin/ingest.
  #
  # environment is the shared anchor unmodified, unlike `test` — the
  # deterministic reviewer path needs GITHUB_MODE=fixture to reach this
  # container.
  ingest:
    build: .
    image: github-push-ingestor-app
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["bin/ingest"]
    command: []
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  # The enrichment half of §5's two request paths, and a separate service rather than a
  # flag on `ingest` for the same reason bin/enrich is a separate file: enrichment belongs
  # to no event source, takes no source lock, and spends a different class of the budget.
  #
  # Identical plumbing to `ingest` otherwise, entrypoint included, so both bare and flagged
  # invocations work:
  #
  #   docker compose run --rm enrich
  #   docker compose run --rm enrich --limit 6 --class actor
  enrich:
    build: .
    image: github-push-ingestor-app
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["bin/enrich"]
    command: []
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  # Depends only on db (never on the development `setup` service) and
  # prepares its own isolated test databases: github_push_ingestor_test and
  # github_push_ingestor_queue_test (plan §2A, §12).
  test:
    build: .
    image: github-push-ingestor-app
    profiles: ["tools"]
    restart: "no"
    command: ["bash", "-c", "bin/rails db:test:prepare && bundle exec rspec"]
    environment:
      <<: *app_env
      RAILS_ENV: test
      # Pinned rather than inherited: the suite exercises the live transport under
      # WebMock and sets fixture mode itself where it wants it, so
      # `GITHUB_MODE=fixture docker compose run --rm test` must not quietly run a
      # different suite than CI.
      GITHUB_MODE: live
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
