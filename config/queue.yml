# Solid Queue's process topology. One supervisor per `worker` container: a dispatcher, a
# scheduler for config/recurring.yml, and two worker processes.
#
# The entity tables are the durable enrichment backlog. Queue deliveries are bounded wake-up
# hints, not one job per entity, but that backlog can remain non-empty for many quota windows.
# A dedicated single-thread enrichment worker keeps that long-lived workload isolated. The
# other worker polls only the bounded polling and control queues; polling is listed first so
# source acquisition stays prompt, while the one-per-minute job cadence keeps control work
# from accumulating behind it. Both request paths still serialize outbound traffic through
# Github::RequestGate, and two processes avoid opening a third primary-database pool.
#
# polling_interval stays at 1s. Nothing here is latency-sensitive: the poll cadence is
# POLL_INTERVAL_SECONDS (300), enrichment is capped by the hourly allowance (40 at the
# defaults), and both recurring tasks fire on a 60-second schedule.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: polling,control
      threads: 1
      processes: 1
      polling_interval: 1
    - queues: enrichment
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
