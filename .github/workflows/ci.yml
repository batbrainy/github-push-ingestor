name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    name: Repository foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required repository files exist
        run: |
          test -f IMPLEMENTATION_PLAN.md
          test -f README.md
          test -f LICENSE
          test -f CLAUDE.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/workflows/ci.yml

  # The real suite runs from PR 3 onward (IMPLEMENTATION_PLAN.md §13). Ruby is pinned
  # from .ruby-version — the same pin the Dockerfile uses — so CI and the image can
  # never drift.
  test:
    name: RSpec suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # ruby-version is deliberately omitted: setup-ruby reads .ruby-version when it
      # is unset, so the pin lives in exactly one place.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Prepares both isolated test databases declared in config/database.yml. The
      # queue database is schema-empty until PR 8; a version-0 schema loads cleanly.
      - name: Prepare test databases
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec

      # The suite loads Rails through rails_helper, so it can never prove that the
      # one-shot's own boot path works: its shebang, its config/environment require, and
      # every stdlib the command depends on but the test harness happens to have loaded
      # already. Running it once is the only thing that does — a missing `require
      # "optparse"` survived the whole suite and died on the first real invocation.
      #
      # Fixture mode so it touches no network, and RAILS_ENV=test is already job-level so
      # it uses the prepared test database and never a development one.
      - name: Smoke test the one-shot ingestion command
        env:
          GITHUB_MODE: fixture
        run: bin/ingest

      # Ordered after the ingestion smoke deliberately: that step has already initialized
      # the rate-limit window and persisted the corpus's stub entities, so this one runs
      # the whole §12 chain — poll, persist, stub, enrich — across two real processes with
      # no network at all.
      - name: Smoke test the one-shot enrichment command
        env:
          GITHUB_MODE: fixture
        run: bin/enrich --limit 6
