name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    name: Repository foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required repository files exist
        run: |
          test -f IMPLEMENTATION_PLAN.md
          test -f README.md
          test -f LICENSE
          test -f CLAUDE.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/workflows/ci.yml

  # The real suite runs from PR 3 onward (IMPLEMENTATION_PLAN.md §13). Ruby is pinned
  # from .ruby-version — the same pin the Dockerfile uses — so CI and the image can
  # never drift.
  test:
    name: RSpec suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # ruby-version is deliberately omitted: setup-ruby reads .ruby-version when it
      # is unset, so the pin lives in exactly one place.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Prepares both isolated test databases declared in config/database.yml, including
      # Solid Queue's tables in the queue database (db/queue_migrate, dumped to
      # db/queue_schema.rb).
      - name: Prepare test databases
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec

      # spec/stress opens several real PostgreSQL sessions to prove the budget ledger's row
      # lock under contention, which breaks the single-pinned-session assumption the rest of
      # the suite is built on. `.rspec` excludes the directory from the run above; this step
      # is what executes it, in its own process. See spec/stress/README.md.
      - name: Run the budget-ledger stress suite
        run: bundle exec rspec spec/stress

      # The suite loads Rails through rails_helper, so it can never prove that the
      # one-shot's own boot path works: its shebang, its config/environment require, and
      # every stdlib the command depends on but the test harness happens to have loaded
      # already. Running it once is the only thing that does — a missing `require
      # "optparse"` survived the whole suite and died on the first real invocation.
      #
      # Fixture mode so it touches no network, and RAILS_ENV=test is already job-level so
      # it uses the prepared test database and never a development one.
      - name: Smoke test the one-shot ingestion command
        env:
          GITHUB_MODE: fixture
        run: bin/ingest

      # Ordered after the ingestion smoke deliberately: that step has already initialized
      # the rate-limit window and persisted the corpus's stub entities, so this one runs
      # the whole §12 chain — poll, persist, stub, enrich — across two real processes with
      # no network at all.
      - name: Smoke test the one-shot enrichment command
        env:
          GITHUB_MODE: fixture
        run: bin/enrich --limit 6

      # Solid Queue's own validator over config/queue.yml and config/recurring.yml: a
      # schedule Fugit cannot parse, or a task naming a class that does not exist, fails
      # here rather than in a worker container at 3am. Starts no process.
      - name: Validate the queue configuration
        run: bin/rails solid_queue:check

      # The supervisor's own boot path, for the reason the two smokes above exist: the suite
      # never runs bin/jobs, so nothing else would catch a queue database without its schema,
      # a scheduler that cannot register its recurring tasks, or a TERM it does not honour.
      # Deliberately not long enough to guarantee a tick — the 60-second schedule would make
      # that a 70-second CI step — so what it proves is boot, registration and clean
      # shutdown; the tick's own behaviour is spec/jobs' business.
      #
      # GITHUB_MODE=fixture is not optional: this boots a real scheduler that can run a real
      # poll, in a separate process WebMock cannot see, and a live-mode worker would spend a
      # runner's unauthenticated quota on every push.
      - name: Smoke test the worker supervisor
        env:
          GITHUB_MODE: fixture
        run: timeout --preserve-status --signal=TERM 20 bin/jobs
